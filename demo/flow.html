<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>flow</title>
<style>
:root{--bg:#f4f1ea;--win:#17191e;--bar:#22252c;--fg:#e7e5df;--dim:#8d929b;--acc:#d97757;--pro:#3fb27f;--contra:#ec6a5e;--neutral:#a7afbb;--mod:#7d97ff;--line:#2d313a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);width:880px;height:560px;overflow:hidden}
body{padding:22px 26px;font:15px/1.5 "JetBrains Mono","DejaVu Sans Mono","Noto Sans Mono",monospace;color:var(--fg)}
[dir=rtl] body,[dir=rtl] .win{font-family:"Noto Sans Arabic","DejaVu Sans","Noto Sans",sans-serif}
.win{height:516px;background:var(--win);border-radius:12px;box-shadow:0 18px 40px rgba(40,30,10,.25);display:flex;flex-direction:column;overflow:hidden}
.bar{height:34px;background:var(--bar);display:flex;align-items:center;gap:8px;padding:0 14px;direction:ltr}
.bar i{width:12px;height:12px;border-radius:50%;display:block}
.bar span{margin-left:auto;margin-right:auto;color:var(--dim);font-size:12.5px;font-family:"DejaVu Sans",sans-serif}
.scr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 20px 16px;overflow:hidden}
.ln{margin:2px 0;white-space:pre-wrap}
.cmd{unicode-bidi:plaintext;text-align:left}
.cmd .p{color:var(--acc);font-weight:700}
.cur{display:inline-block;width:9px;height:17px;background:var(--fg);vertical-align:-3px;margin:0 2px}
.dim{color:var(--dim)}
.dot{color:var(--acc)}
.ok{color:var(--pro)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 2px}
.chip{display:inline-block;background:var(--acc);color:#1a1a1a;font-weight:700;font-size:12px;padding:1px 8px;border-radius:5px;margin-inline-end:8px}
.opt{display:flex;gap:10px;padding:3px 6px;border-radius:6px}
.opt.on{background:#262a33}
.box{color:var(--dim);width:2.2em;flex:none;direction:ltr}
.box.x{color:var(--pro)}
.opt .d{color:var(--dim)}
.hint{color:var(--dim);font-size:12.5px;margin-top:6px}
.ag{display:grid;grid-template-columns:230px 1fr 260px;gap:12px;align-items:center;margin:3px 0}
.track{height:7px;background:#2a2e37;border-radius:9px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--mod),var(--acc));border-radius:9px}
.msg{margin:4px 0}
.who{font-weight:700}
.verd{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;display:flex;gap:16px;align-items:center}
.badge{border-radius:10px;padding:8px 14px;text-align:center;min-width:110px}
.badge b{display:block;font-size:22px}
.badge small{display:block;font-size:11.5px;opacity:.8;font-family:"DejaVu Sans",sans-serif}
.vl{font-size:14px}
.vl div{margin:2px 0}
</style>
</head>
<body>
<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span id="t"></span></div><div class="scr" id="s"></div></div>
<script>
var F = __FLOW__, EV = __EVENTS__;
document.documentElement.dir = F.dir;
document.getElementById('t').textContent = F.ui.title;
var n = parseInt(location.hash.slice(1) || EV.length, 10);
function esc(x){return String(x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var st = {typed:0, entered:false, think:-1, done:[], q:-1, cur:0, ticks:[], agents:-1, debate:-1, verdict:false, saved:false};
for (var i=0;i<n && i<EV.length;i++){
  var e = EV[i];
  if(e.t==='type') st.typed=e.n;
  else if(e.t==='enter') st.entered=true;
  else if(e.t==='think') st.think=e.i;
  else if(e.t==='q'){st.q=e.i;st.cur=0;st.ticks=[];}
  else if(e.t==='cur') st.cur=e.o;
  else if(e.t==='tick'){st.cur=e.o;st.ticks.push(e.o);}
  else if(e.t==='submit'){st.done.push({i:e.i,ticks:st.ticks.slice()});st.q=-1;}
  else if(e.t==='agents') st.agents=e.p;
  else if(e.t==='debate') st.debate=e.i;
  else if(e.t==='verdict') st.verdict=true;
  else if(e.t==='saved') st.saved=true;
}
var h = '<div class="ln cmd"><span class="p">❯</span> '+esc(F.cmd.slice(0,st.typed))+(st.entered?'':'<span class="cur"></span>')+'</div>';
for (var k=0;k<=st.think;k++) h += '<div class="ln"><span class="dot">●</span> <span class="dim">'+esc(F.think[k])+'</span></div>';
st.done.forEach(function(d){
  var Q=F.questions[d.i];
  h += '<div class="ln"><span class="ok">✓</span> <b>'+esc(Q.h)+':</b> <span class="dim">'+esc(d.ticks.map(function(j){return Q.o[j][0].replace(' ⭐','');}).join(' · '))+'</span></div>';
});
if (st.q>=0){
  var Q=F.questions[st.q];
  h += '<div class="q"><div><span class="chip">'+esc(Q.h)+'</span>'+esc(Q.q)+'</div>';
  Q.o.forEach(function(o,j){
    var x = st.ticks.indexOf(j)>=0;
    h += '<div class="opt'+(st.cur===j?' on':'')+'"><span class="box'+(x?' x':'')+'">'+(x?'[✓]':'[ ]')+'</span><span>'+esc(o[0])+(o[1]?' <span class="d">– '+esc(o[1])+'</span>':'')+'</span></div>';
  });
  h += '<div class="hint">'+esc(F.ui.hint)+'</div></div>';
}
if (st.agents>=0){
  h += '<div class="ln" style="margin-top:8px"><b>'+esc(F.agents_title)+'</b></div>';
  F.agents.forEach(function(a,j){
    var p = Math.max(0, Math.min(1, st.agents*1.45 - j*0.06 - (j%2)*0.08));
    h += '<div class="ag"><span>'+esc(a[0])+'</span><div class="track"><div class="fill" style="width:'+(p*100).toFixed(0)+'%"></div></div><span class="'+(p>=1?'ok':'dim')+'">'+(p>=1?esc(a[1]):'…')+'</span></div>';
  });
}
var farbe = {pro:'var(--pro)',contra:'var(--contra)',neutral:'var(--neutral)',moderator:'var(--mod)'};
for (var m=0;m<=st.debate;m++){
  var D=F.debate[m];
  h += '<div class="msg"><span class="who" style="color:'+farbe[D[0]]+'">'+esc(D[1])+':</span> '+esc(D[2])+'</div>';
}
if (st.verdict){
  var V=F.verdict;
  var b = V.urteil ? '<div class="badge" style="background:rgba(232,160,60,.16);color:#f0b35a"><b>'+esc(V.urteil)+'</b><small>'+esc(F.ui.verdict)+'</small></div>' : '';
  b += '<div class="badge" style="background:#262a33"><b>'+esc(V.note)+'</b><small>'+esc(V.urteil?V.note_label:(F.ui.verdict+' · '+V.note_label))+'</small></div>';
  h += '<div class="verd">'+b+'<div class="vl">'+V.lines.map(function(l){return '<div>'+esc(l)+'</div>';}).join('')+'</div></div>';
}
if (st.saved) h += '<div class="ln ok" style="margin-top:8px">'+esc(F.saved)+'</div>';
document.getElementById('s').innerHTML = h;
</script>
</body>
</html>
